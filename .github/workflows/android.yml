name: Build Android Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - Android32
          - Android64

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Compile Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: given

      - name: Save compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Buffer-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
